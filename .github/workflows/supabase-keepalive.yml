name: Supabase Keep-Alive

# Free-tier Supabase projects pause after ~1 week with no API traffic.
# Pings both projects' REST API on a schedule so they never go quiet
# long enough to pause -- any HTTP response (even a permission-denied
# 401/403) counts as real traffic reaching the project; a connection
# failure is the only thing that should fail this job.
on:
  schedule:
    # Mon & Thu, 00:00 UTC -- under 4 days between runs even if one is
    # delayed or skipped, comfortably inside the ~7-day pause window.
    - cron: "0 0 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping staging Supabase project
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          # Secrets pasted via the GitHub UI can pick up a trailing
          # newline from the clipboard, which splits the URL mid-string
          # and gives curl a "malformed URL" error (exit 3) -- strip any
          # stray whitespace/newlines rather than relying on a perfectly
          # clean paste every time a secret is updated.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$url/rest/v1/organizations?select=id&limit=1" \
            -H "apikey: $key")
          echo "staging responded: $status"

      - name: Ping production Supabase project
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$url/rest/v1/organizations?select=id&limit=1" \
            -H "apikey: $key")
          echo "production responded: $status"
